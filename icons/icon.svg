<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#primaryGrad)" />
  
  <!-- Subtle inner glowing ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />
  
  <!-- Wallet / Shield Base Card -->
  <g filter="url(#shadow)">
    <!-- Main Card -->
    <rect x="100" y="140" width="312" height="232" rx="28" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Top accent bar -->
    <rect x="100" y="140" width="312" height="48" rx="28" fill="#064e3b" />
    <rect x="100" y="170" width="312" height="18" fill="#064e3b" />
    
    <!-- Wallet flap -->
    <path d="M 280 220 L 400 220 C 412 220 412 292 400 292 L 280 292 C 265 292 265 220 280 220 Z" fill="#059669" />
    <circle cx="365" cy="256" r="12" fill="#fbbf24" />
    
    <!-- Growth Arrow & Sparkle -->
    <path d="M 140 310 L 190 260 L 230 285 L 300 210" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="290,210 305,205 305,225" fill="#10b981" />
  </g>

  <!-- Currency Rp Badge -->
  <g transform="translate(136, 210)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#064e3b" letter-spacing="-1">Rp</text>
  </g>
</svg>
